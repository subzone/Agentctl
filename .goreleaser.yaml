version: 2

project_name: m

before:
  hooks:
    - go mod tidy

builds:
  - id: m
    main: ./cmd/m
    binary: m
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.Version={{.Version}}

archives:
  - id: tarballs
    name_template: "m_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: deb
    package_name: m
    vendor: subzone
    homepage: https://github.com/subzone/Agentctl
    maintainer: Milenko Mitrovic <milenkom81@gmail.com>
    description: MD-driven agent CLI for code, infrastructure, and automation
    license: MIT
    formats:
      - deb
    bindir: /usr/local/bin

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: subzone
    name: Agentctl
  draft: false
  prerelease: auto
  replace_existing_artifacts: true

changelog:
  use: github-native

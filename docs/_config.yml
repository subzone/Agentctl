title: m
description: MD-driven agent CLI for code, infra, and automation
remote_theme: just-the-docs/just-the-docs@v0.10.1
color_scheme: dark

plugins:
  - jekyll-remote-theme

url: https://subzone.github.io
baseurl: /m

aux_links:
  GitHub: https://github.com/subzone/m

nav_sort: case_insensitive
search_enabled: true
search.button: true

heading_anchors: true

back_to_top: true
back_to_top_text: "Back to top"

footer_content: '<a href="https://github.com/subzone/m">m</a> &mdash; MD-driven agent CLI &middot; MIT License'

head_extra: |
  <link rel="stylesheet" href="/m/assets/css/custom.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

callouts:
  warning:
    title: Warning
    color: yellow
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  gate:
    name: Vet + Lint + Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          golangci-lint run

      - name: gosec (SAST)
        shell: bash
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -quiet -exclude=G104,G115,G118,G122,G204,G301,G304,G306,G704 ./...

      - name: govulncheck (SCA)
        shell: bash
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || echo "::warning::govulncheck found vulnerabilities (see above)"

      - name: Tests
        run: go test -race -count=1 ./...

  linux:
    name: Linux (.deb + tarballs)
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos-desktop:
    name: macOS Desktop (.app.zip)
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Build desktop app
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          wails build -clean -ldflags "-X main.Version=${VERSION}"

      - name: Sign with entitlements
        run: |
          codesign --force --deep --sign - \
            --entitlements build/darwin/entitlements.plist \
            build/bin/AgentCTL.app

      - name: Package as zip
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/bin
          zip -r "AgentCTL_${VERSION}_macos.zip" AgentCTL.app

      - name: Upload desktop app to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            "build/bin/AgentCTL_${VERSION}_macos.zip" \
            --clobber

  linux-desktop:
    name: Linux Desktop (.tar.gz)
    needs: linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            pkg-config \
            build-essential

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build frontend
        run: cd frontend && npm ci && npm run build

      - name: Build desktop app
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          wails build -clean -ldflags "-X main.Version=${VERSION}"

      - name: Package as tar.gz
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd build/bin
          tar -czf "AgentCTL_${VERSION}_linux_amd64.tar.gz" m

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            "build/bin/AgentCTL_${VERSION}_linux_amd64.tar.gz" \
            --clobber

  windows-desktop:
    name: Windows Desktop (.exe.zip)
    needs: linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install WebView2
        run: |
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile 'MicrosoftEdgeWebview2Setup.exe'
          Start-Process -FilePath 'MicrosoftEdgeWebview2Setup.exe' -ArgumentList '/silent /install' -Wait
        shell: pwsh

      - name: Build frontend
        shell: bash
        run: cd frontend && npm ci && npm run build

      - name: Build desktop app
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ~/go/bin/wails build -clean -ldflags "-X main.Version=${VERSION}"

      - name: Package as zip
        shell: pwsh
        run: |
          $VERSION = $env:GITHUB_REF_NAME -replace '^v',''
          $ZIP = "build/bin/AgentCTL_${VERSION}_windows_amd64.zip"
          Compress-Archive -Path build/bin/m.exe -DestinationPath $ZIP

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            "build/bin/AgentCTL_${VERSION}_windows_amd64.zip" \
            --clobber

  macos:
    name: macOS (.pkg)
    needs: linux
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build universal binary
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/pkgroot/usr/local/bin
          GOOS=darwin GOARCH=amd64 go build \
            -ldflags "-s -w -X main.Version=${VERSION}" \
            -o dist/m-amd64 ./cmd/m
          GOOS=darwin GOARCH=arm64 go build \
            -ldflags "-s -w -X main.Version=${VERSION}" \
            -o dist/m-arm64 ./cmd/m
          lipo -create -output dist/pkgroot/usr/local/bin/m \
            dist/m-amd64 dist/m-arm64
          chmod +x dist/pkgroot/usr/local/bin/m

      - name: Build .pkg
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          pkgbuild \
            --root dist/pkgroot \
            --identifier com.subzone.m \
            --version "${VERSION}" \
            --install-location / \
            "dist/m_${VERSION}_macos_universal.pkg"

      - name: Upload .pkg to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/m_${VERSION}_macos_universal.pkg" \
            --clobber

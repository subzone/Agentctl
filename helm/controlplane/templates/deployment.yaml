apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentctl-controlplane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentctl-controlplane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "agentctl-controlplane.selectorLabels" . | nindent 6 }}
  strategy:
    # Recreate, not RollingUpdate: the SQLite file lives on a ReadWriteOnce
    # volume that only one pod can mount at a time.
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "agentctl-controlplane.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: controlplane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8090
              name: http
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "agentctl-controlplane.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}

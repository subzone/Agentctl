apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentctl-controlplane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentctl-controlplane.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.service.targetPort | quote }}
    prometheus.io/path: "/metrics"
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "agentctl-controlplane.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
